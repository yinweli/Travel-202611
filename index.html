<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 10月 東京旅遊資料索引</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ee;
      --panel: #fffdfa;
      --text: #1f2933;
      --muted: #667085;
      --line: #d9d2c7;
      --link: #77543b;
      --link-hover: #6b3f22;
      --accent: #b7794a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    section {
      margin-top: 24px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(70, 48, 30, .05);
    }

    h2 {
      display: inline-flex;
      align-items: center;
      margin: 0 0 18px;
      padding: 4px 0 8px;
      border-bottom: 2px solid var(--accent);
      font-size: 1.35rem;
      line-height: 1.35;
      color: var(--link);
    }

    ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .single-column-list {
      grid-template-columns: 1fr;
    }

    li {
      min-width: 0;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 2px 0;
      color: var(--link);
      font-weight: 600;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    a:hover,
    a:focus-visible {
      color: var(--link-hover);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    @media (max-width: 560px) {
      main {
        width: min(100% - 24px, 920px);
        padding: 28px 0;
      }

      section {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>2026 10月 東京旅遊資料索引</h1>
      <p>旅遊地點列表與各區詳細資料。</p>
    </header>

    <section aria-labelledby="main-list-title">
      <h2 id="main-list-title">規劃資料</h2>
      <ul>
        <li><a href="旅遊地點列表.html">旅遊地點列表</a></li>
      </ul>
    </section>

    <section aria-labelledby="detail-pages-title">
      <h2 id="detail-pages-title">地點資料</h2>
      <ul class="single-column-list">
        <li><a href="旅遊地點詳細資料-橫濱第一日.html">橫濱第一日（10/06 山手・元町・中華街）</a></li>
        <li><a href="旅遊地點詳細資料-橫濱第二日.html">橫濱第二日（10/07 港未來・杯麵博物館）</a></li>
        <li><a href="旅遊地點詳細資料-北鐮倉.html">北鐮倉</a></li>
        <li><a href="旅遊地點詳細資料-南鐮倉.html">南鐮倉</a></li>
        <li><a href="旅遊地點詳細資料-箱根2日.html">箱根兩日</a></li>
        <li><a href="旅遊地點詳細資料-高尾山.html">高尾山</a></li>
        <li><a href="旅遊地點詳細資料-哈利波特製片廠.html">哈利波特製片廠</a></li>
        <li><a href="旅遊地點詳細資料-池袋.html">池袋</a></li>
        <li><a href="旅遊地點詳細資料-澀谷.html">澀谷</a></li>
        <li><a href="旅遊地點詳細資料-淺草・合羽橋.html">淺草・合羽橋</a></li>
        <li><a href="旅遊地點詳細資料-銀座・有樂町.html">銀座・有樂町</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
